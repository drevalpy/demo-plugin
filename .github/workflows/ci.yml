name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A plugin that fails to import is an error here, not a warning.
      DREVALPY_STRICT_PLUGINS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ty check
      - run: uv run --frozen pytest
      - run: uv run --frozen drevalpy list plugins --strict
